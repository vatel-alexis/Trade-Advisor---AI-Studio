name: E2E

# The whole stack from docker compose, a PEA refresh, then API and web page checks.
on:
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Preflight
        run: docker compose exec -T worker python -m app.worker check
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e backend
      - name: PEA report, API and pages
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://trading:trading@localhost:5432/trading_advisor
        run: python -m tests.e2e_smoke
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
