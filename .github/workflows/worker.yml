name: Worker

# Daily PEA ETF portfolio refresh after the Euronext Paris close (17:35 Paris time).
# Needs the repository secret DATABASE_URL; until DATABASE_URL is set, every run stops at the first step.
on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "pea = recalculer maintenant, tick = si dû, loop = en continu, check = diagnostic"
        type: choice
        options: [pea, tick, loop, check]
        default: pea

concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Hosted database configured?
        id: configured
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Secret DATABASE_URL absent : rien à faire (voir docs/hebergement-gratuit.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - if: steps.configured.outputs.ok == 'true'
        run: pip install .
      - if: steps.configured.outputs.ok == 'true'
        run: alembic upgrade head
      - if: steps.configured.outputs.ok == 'true'
        id: worker
        run: |
          date +%s > "$RUNNER_TEMP/started"
          python -m app.worker ${{ inputs.command || 'pea' }}
      - name: Start the next run
        if: "!cancelled() && steps.configured.outputs.ok == 'true' && inputs.command == 'loop'"
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.worker.outcome }}
        run: |
          started=$(cat "$RUNNER_TEMP/started" 2>/dev/null || date +%s)
          if [ "$OUTCOME" != "success" ] && [ $(( $(date +%s) - started )) -lt 1800 ]; then
            echo "::warning::Échec rapide : pas de relance, le passage planifié reprendra."
            exit 0
          fi
          gh workflow run worker.yml --repo "$GITHUB_REPOSITORY" --ref main -f command=loop
